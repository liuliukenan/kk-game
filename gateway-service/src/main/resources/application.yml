server:
  port: 8081

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      server-addr: 192.168.1.18:8848
      discovery:
        namespace: kk-game
      config:
        namespace: kk-game
        file-extension: yml
        group: DEFAULT_GROUP
        refresh-enabled: true
    gateway:
      routes:
        - id: websocket-service-route
          uri: lb:ws://websocket-service  # 使用WebSocket协议负载均衡转发到 websocket-service
          predicates:
            - Path=/ws/**                 # 匹配 WebSocket 路径前缀
          filters:
            - StripPrefix=1               # 转发时去掉前缀 /ws
  config:
    import:
      - nacos:gateway-server.yml
